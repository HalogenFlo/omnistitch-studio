name: Feature request
description: Propose a research or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Research or user need
      description: Explain the workflow and why existing behavior is insufficient.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and validation
      description: List alternatives considered and how correctness could be tested.
