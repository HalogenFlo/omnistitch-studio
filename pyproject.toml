[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistitch-studio"
version = "1.0.0"
description = "Planar image stitching studio with interactive editing, localized clarity inspection, and DeepZoom export."
readme = "README.md"
authors = [
  { name = "Tien-Phat Nguyen" }
]
maintainers = [
  { name = "Tien-Phat Nguyen" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0,<2.3.0",
    "opencv-python>=4.8.0,<5.0.0",
    "Pillow>=10.0.0,<13.0.0",
    "psutil>=5.9.0,<8.0.0",
    "tifffile>=2023.7.10",
]

[project.urls]
"Homepage" = "https://github.com/Phatjhhoq8/omnistitch-studio"
"Bug Tracker" = "https://github.com/Phatjhhoq8/omnistitch-studio/issues"
"Documentation" = "https://github.com/Phatjhhoq8/omnistitch-studio#readme"

[project.scripts]
omnistitch-studio = "omnistitch_studio.server:main"

[tool.setuptools]
packages = ["omnistitch_studio", "backend"]
package-dir = { omnistitch_studio = ".", backend = "backend" }
include-package-data = true

[tool.setuptools.package-data]
omnistitch_studio = [
    "index.html",
    "styles.css",
    "app.js",
    "frontend/*.js",
]
