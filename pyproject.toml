[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistitch-studio"
version = "1.0.0"
description = "Cross-domain gigapixel image stitching studio for biomedical microscopy (WSI) and geospatial remote sensing (UAV/satellite) with interactive deep zoom and clarity inspection."
readme = "README.md"
authors = [
  { name = "OmniStitch Studio Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.urls]
"Homepage" = "https://github.com/Phatjhhoq8/omnistitch-studio"
"Bug Tracker" = "https://github.com/Phatjhhoq8/omnistitch-studio/issues"
